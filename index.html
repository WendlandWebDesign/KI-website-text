<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wendland Web Design – Hero Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070b16;
        --bg-soft: #10172a;
        --text: #f2f5ff;
        --muted: #a7b1d1;
        --brand-a: #47d7ff;
        --brand-b: #7b5cff;
        --brand-c: #23ffa0;
        --card: rgba(16, 23, 42, 0.65);
        --border: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 10%, #1a2250 0%, var(--bg) 45%),
          linear-gradient(160deg, #070b16, #090f1f 60%, #0a1124);
      }

      .hero {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .bg-layer {
        position: absolute;
        inset: -20%;
        pointer-events: none;
      }

      .noise {
        z-index: -3;
        opacity: 0.16;
        mix-blend-mode: soft-light;
        background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.9) 1px, transparent 0);
        background-size: 3px 3px;
      }

      .grid {
        z-index: -2;
        opacity: 0.35;
        transform: perspective(700px) rotateX(62deg) translateY(24%);
        transform-origin: center;
        background-image: linear-gradient(rgba(71, 215, 255, 0.3) 1px, transparent 1px),
          linear-gradient(90deg, rgba(123, 92, 255, 0.3) 1px, transparent 1px);
        background-size: 80px 80px;
      }

      .glow {
        z-index: -1;
        filter: blur(60px);
      }

      .orb {
        position: absolute;
        width: 320px;
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0.7;
        will-change: transform;
      }

      .orb.a {
        left: 12%;
        top: 20%;
        background: radial-gradient(circle at 30% 30%, rgba(71, 215, 255, 0.9), transparent 65%);
      }

      .orb.b {
        right: 10%;
        top: 10%;
        background: radial-gradient(circle at 40% 40%, rgba(123, 92, 255, 0.85), transparent 65%);
      }

      .orb.c {
        left: 42%;
        bottom: 0;
        background: radial-gradient(circle at 45% 45%, rgba(35, 255, 160, 0.8), transparent 65%);
      }

      .hero-content {
        width: min(1100px, 92vw);
        padding: 3rem;
        border: 1px solid var(--border);
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(26, 34, 80, 0.48), rgba(16, 23, 42, 0.64));
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 60px rgba(2, 4, 14, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        padding: 0.4rem 0.85rem;
        color: #d5ddff;
        font-size: 0.9rem;
        letter-spacing: 0.02em;
      }

      .badge::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: linear-gradient(120deg, var(--brand-a), var(--brand-c));
      }

      h1 {
        margin: 1.1rem 0 1rem;
        font-size: clamp(2.2rem, 5.8vw, 4.6rem);
        line-height: 1.08;
        max-width: 14ch;
      }

      .accent {
        background: linear-gradient(120deg, var(--brand-a), var(--brand-c));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        margin: 0;
        max-width: 55ch;
        color: var(--muted);
        font-size: clamp(1rem, 1.6vw, 1.2rem);
      }

      .actions {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
      }

      .btn {
        appearance: none;
        border: 0;
        padding: 0.85rem 1.3rem;
        border-radius: 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .btn.primary {
        background: linear-gradient(120deg, #2bb8ff, #6c52ff);
        color: white;
        box-shadow: 0 10px 30px rgba(59, 148, 255, 0.35);
      }

      .btn.secondary {
        color: #d9e0ff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn:active {
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        .hero-content {
          padding: 2rem 1.3rem;
          border-radius: 22px;
        }

        .orb {
          width: 250px;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="bg-layer noise"></div>
      <div class="bg-layer grid"></div>
      <div class="bg-layer glow">
        <div class="orb a" data-depth="0.35"></div>
        <div class="orb b" data-depth="0.25"></div>
        <div class="orb c" data-depth="0.45"></div>
      </div>

      <div class="hero-content">
        <span class="badge">Webdesign Agentur aus dem Wendland</span>
        <h1>
          Wir bauen digitale Marken mit
          <span class="accent">wow‑Effekt</span>.
        </h1>
        <p>
          <strong>Wendland Web Design</strong> gestaltet performante Websites, die modern aussehen,
          blitzschnell laden und Kundenanfragen messbar steigern.
        </p>
        <div class="actions">
          <button class="btn primary">Projekt starten</button>
          <button class="btn secondary">Referenzen ansehen</button>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const orbs = document.querySelectorAll('.orb');
      const grid = document.querySelector('.grid');
      const hero = document.querySelector('.hero');

      gsap.to('.orb.a', { x: 40, y: -30, duration: 5.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      gsap.to('.orb.b', { x: -35, y: 25, duration: 6.2, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      gsap.to('.orb.c', { x: 25, y: -40, duration: 5.8, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      gsap.to('.grid', { backgroundPosition: '0px 80px', duration: 6, repeat: -1, ease: 'none' });

      hero.addEventListener('pointermove', (event) => {
        const x = event.clientX / window.innerWidth - 0.5;
        const y = event.clientY / window.innerHeight - 0.5;

        gsap.to(grid, {
          x: x * 40,
          y: y * 30,
          rotateZ: x * 2,
          duration: 0.8,
          ease: 'power3.out'
        });

        orbs.forEach((orb) => {
          const depth = Number(orb.dataset.depth || 0.2);
          gsap.to(orb, {
            x: x * 90 * depth,
            y: y * 70 * depth,
            duration: 0.9,
            ease: 'power3.out'
          });
        });
      });
    </script>
  </body>
</html>
